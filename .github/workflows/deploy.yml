name: Deploy modules to Hetzner

# Runs on every branch so the manifest gate below can validate pushes/PRs, but the
# deploy job itself is pinned to main/master (see its `if:`), so a branch push
# validates without ever shipping to prod.
on:
  push:
    branches: ['**']

jobs:
  # ── Pre-deploy gate ──────────────────────────────────────────────────────
  # Every manifest must satisfy the fail-closed moduleLoader contract or the
  # deploy is blocked. This is the guard whose ABSENCE let an unloadable
  # decision-maker-selector manifest ship (missing output_schema + invalid cost)
  # and crash-loop prod for ~22h — loadModules() is imported at boot by
  # pipeline-api AND stage-worker AND batch-worker, so one bad manifest downs the
  # whole pipeline. The deploy job `needs:` this, so a non-zero exit here fails
  # the workflow and rsync never runs.
  #
  # Manifests ONLY — deliberately NOT the full module test suites, some of which
  # are independently red (e.g. card-human-rewriter) and would block every deploy.
  # This gate covers exactly the class of failure that took prod down.
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate every manifest is loadable (moduleLoader contract)
        run: node modules/test-manifests-loadable.js

  deploy:
    needs: validate-manifests
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Write build info
        run: |
          echo "{\"commit\":\"$(git rev-parse --short HEAD)\",\"message\":\"$(git log -1 --format=%s)\",\"time\":\"$(git log -1 --format=%ci)\"}" > build-info.json

      - name: Sync modules to server
        run: |
          rsync -azP --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ root@188.245.110.34:/opt/content-pipeline-modules-v2/

      - name: Install deps and restart PM2 (deterministic cycle)
        run: |
          # Mirrors skeleton repo's deploy.sh PM2 lifecycle. Two failure modes
          # this closes (both observed in this codebase):
          #   1. PM2 6.0.14 named-restart races: `pm2 restart stage-worker` can
          #      report "Process 1 not found" when the daemon's process map
          #      gets cycled mid-flight by another deploy. Failed on every
          #      modules-v2 push from v1.5.0 onwards (2026-06-09).
          #   2. Stale dump.pm2 from the 2026-06-02 silent-truncation issue:
          #      a fresh `pm2 save` after `pm2 start` rewrites the dump.
          # Brief gap: ~5-30s while apps stop and restart. profile-api's Chrome
          # respawns via its own 120s health check after profile-api restarts.
          ssh -i ~/.ssh/deploy_key root@188.245.110.34 \
            "cd /opt/content-pipeline-modules-v2 && npm install --omit=dev && \
             cd /opt/content-pipeline-v2 && pm2 delete all 2>/dev/null || true && \
             pm2 start ecosystem.config.cjs && pm2 save"
